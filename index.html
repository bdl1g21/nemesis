<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemesis Portal</title>

<style>
html,body{
  margin:0;
  height:100%;
  background: radial-gradient(circle at center, #220000 0%, #000 70%);
  overflow:hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  color:#fff;
}

/* ===== THEME ===== */
:root{
  --glowA: rgba(255,40,40,.85);
  --glowB: rgba(255,0,0,.75);
  --halo:  rgba(255,0,0,.30);
  --panel: rgba(0,0,0,.55);
  --line: rgba(255,255,255,.18);
}

/* Header */
header{
  position:fixed;
  top:0; left:0; right:0;
  padding:14px 18px;
  background: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.55));
  backdrop-filter: blur(8px);
  border-bottom:1px solid var(--line);
  z-index:10;
}
.brand{
  letter-spacing:.45em;
  font-weight:800;
  font-size:14px;
}
.sub{
  margin-top:6px;
  opacity:.75;
  font-size:13px;
}

/* Layout */
main{
  height:100%;
  display:grid;
  place-items:center;
  padding-top:90px;
}
.wrap{
  width:min(980px,100%);
  padding:14px;
  display:grid;
  grid-template-columns: 1.1fr .9fr;
  gap:16px;
}
@media(max-width:820px){
  .wrap{ grid-template-columns:1fr; }
}

/* Panels */
.panel{
  background: var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}

/* Buttons */
.links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
@media(max-width:650px){
  .links{ grid-template-columns:1fr; }
}

a.btn{
  text-decoration:none;
  color:#fff;
  padding:18px 16px;
  border-radius:18px;
  font-weight:800;
  letter-spacing:.04em;
  border:1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.06);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.6),
    0 0 26px rgba(255,0,0,.15);
  transition: transform .12s ease, filter .12s ease;
  position:relative;
  overflow:hidden;
}
a.btn:hover{ transform: translateY(-1px); filter: brightness(1.05); }
a.btn:active{ transform: translateY(0px) scale(.995); }

a.btn::after{
  content:"";
  position:absolute;
  inset:-40% -30%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.18), transparent 60%);
  transform: rotate(10deg);
  opacity:.9;
  pointer-events:none;
}

a.btn small{
  display:block;
  margin-top:6px;
  opacity:.75;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

/* Tag colors */
a.btn.admin{ border-color: rgba(255,110,110,.45); }
a.btn.display{ border-color: rgba(255,140,140,.42); }
a.btn.logger{
  border-color: rgba(255,210,120,.46);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.6),
    0 0 26px rgba(255,180,80,.18);
}

/* ===== NEMESIS EYE ===== */
.eye-wrap{
  display:grid;
  place-items:center;
  min-height:320px;
}

.eye-body{
  width:min(48vmin,360px);
  aspect-ratio:1;
  border-radius:50%;
  position:relative;
  background: radial-gradient(circle at 50% 50%, #444 0%, #1a1a1a 60%, #050505 100%);
  box-shadow:
    inset 0 0 0 8px #2b2b2b,
    inset 0 0 0 14px #111,
    0 0 90px var(--halo);
  animation: idleDrift 16s ease-in-out infinite;
}
.eye-body::before{
  content:"";
  position:absolute;
  inset:6%;
  border-radius:50%;
  background: repeating-radial-gradient(circle,
    rgba(255,255,255,.06) 0px,
    rgba(255,255,255,.06) 2px,
    transparent 3px,
    transparent 6px);
  opacity:.25;
}
.metal-ring{
  position:absolute; inset:18%; border-radius:50%;
  background: radial-gradient(circle, #666 0%, #2a2a2a 55%, #111 100%);
  box-shadow: inset 0 0 0 6px #555, inset 0 0 0 10px #222;
}
.emitter-ring{
  position:absolute; inset:30%; border-radius:50%;
  background:
    radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,.05) 10%, rgba(0,0,0,.25) 12%, rgba(0,0,0,0) 18%),
    radial-gradient(circle, var(--glowA) 0%, rgba(255,255,255,.10) 18%, rgba(0,0,0,.15) 45%, rgba(0,0,0,.85) 72%, rgba(0,0,0,1) 100%);
  box-shadow: 0 0 42px var(--glowA), inset 0 0 22px var(--glowB);
  animation: idleGlow 4.5s ease-in-out infinite;
}
.lens{
  position:absolute; inset:38%; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), rgba(255,255,255,.06) 25%, #000 55%);
  box-shadow: inset 0 0 10px rgba(255,255,255,.15), inset 0 0 28px rgba(0,0,0,.95);
}

/* Animations */
@keyframes idleGlow{
  0%,100%{ box-shadow: 0 0 28px var(--glowA), inset 0 0 20px var(--glowB); }
  50%{ box-shadow: 0 0 56px var(--glowA), inset 0 0 28px var(--glowB); }
}
@keyframes idleDrift{
  0%{ transform: translate(0,0) scale(1); }
  25%{ transform: translate(-0.4%, 0.3%) scale(1.01); }
  50%{ transform: translate(0.3%, -0.4%) scale(1.015); }
  75%{ transform: translate(0.2%, 0.4%) scale(1.01); }
  100%{ transform: translate(0,0) scale(1); }
}

/* Footer */
footer{
  position:fixed;
  bottom:0; left:0; right:0;
  padding:10px 16px;
  border-top:1px solid var(--line);
  background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.55));
  font-size:12px;
  opacity:.75;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.kbd{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.06);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:.9;
}
</style>
</head>

<body>

<header>
  <div class="brand">N E M E S I S</div>
  <div class="sub">Portal access · choose your terminal</div>
</header>

<main>
  <div class="wrap">
    <section class="panel">
      <div class="links">
        <!-- Change href to ./admin.html if your admin is a file not a folder -->
        <a class="btn admin" href="./admin/">
          ADMIN CONSOLE
          <small>control & commands</small>
        </a>

        <a class="btn display" href="./display/">
          DISPLAY UNIT
          <small>visual & audio output</small>
        </a>

        <!-- Logger: change href if your logger path differs -->
        <a class="btn logger" href="./logger/">
          LOGGER
          <small>record events during practical</small>
        </a>
      </div>

      <p class="sub" style="margin-top:14px;">
        Tip: Display requires one tap to unlock audio.
      </p>
    </section>

    <section class="panel eye-wrap">
      <div class="eye-body" aria-hidden="true">
        <div class="metal-ring"></div>
        <div class="emitter-ring"></div>
        <div class="lens"></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div>
    Shortcuts:
    <span class="kbd">A</span> Admin
    <span class="kbd">D</span> Display
    <span class="kbd">L</span> Logger
  </div>
  <div id="clock">—</div>
</footer>

<script>
  // Keyboard shortcuts (don’t trigger while typing)
  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;

    const k = e.key.toLowerCase();
    if (k === "a") window.location.href = "./admin/";
    if (k === "d") window.location.href = "./display/";
    if (k === "l") window.location.href = "./logger/";
  });

  // Clock
  const clock = document.getElementById("clock");
  function tick(){ clock.textContent = new Date().toLocaleString(); }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
